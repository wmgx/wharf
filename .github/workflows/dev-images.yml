# 开发分支（p12-dev 等）：构建 wharf-core / wharf-agent 镜像，只打 dev-<短提交号> 标签。
# 不打 latest，不发布 CLI（core 镜像里自带 wharf CLI），线上不会拉到这些镜像。
name: dev-images

on:
  push:
    branches: [ui-dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: |
          echo "tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: core
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wharf-core:${{ steps.tag.outputs.tag }}
          build-args: WHARF_BUILD=${{ steps.tag.outputs.build }}
          cache-from: |
            type=gha
            type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: agent
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wharf-agent:${{ steps.tag.outputs.tag }}
          build-args: WHARF_BUILD=${{ steps.tag.outputs.build }}
          cache-from: |
            type=gha
            type=gha,scope=dev
