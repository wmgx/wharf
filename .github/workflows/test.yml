# push 到 main 和 PR 时跑格式检查、clippy、测试，以及页面的类型检查。
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 锁版本：新版 clippy 加的 lint 不该让 CI 突然变红，升级时一起改。
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: 页面类型没有漂移
        run: |
          cargo run -q -p wharf-cli -- schema web | node web/scripts/gen-types.mjs > /tmp/types.gen.ts
          diff -u web/src/types.gen.ts /tmp/types.gen.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: types-gen
          path: /tmp/types.gen.ts

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: node --experimental-strip-types --test scripts/settings-draft.test.mjs
        working-directory: web
      - run: node scripts/api-parity.mjs
        working-directory: web
      - run: node --disable-warning=ExperimentalWarning --test scripts/zip-pack.test.mjs
        working-directory: web
