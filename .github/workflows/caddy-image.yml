# deploy/caddy 变化时构建网关镜像 wharf-caddy。标签已经存在就跳过，不覆盖线上在用的镜像。
name: caddy-image

on:
  push:
    branches: [main, p12-dev]
    paths: ['deploy/caddy/**', '.github/workflows/caddy-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CADDY_VERSION: 2.11.9
  TAG: 2.11.9-1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: |
          image="ghcr.io/${{ github.repository_owner }}/wharf-caddy:$TAG"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$image 已经存在，跳过。改了 deploy/caddy/Dockerfile 要把 TAG 序号加一。"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: deploy/caddy
          load: true
          tags: ${{ steps.image.outputs.name }}
          build-args: CADDY_VERSION=${{ env.CADDY_VERSION }}
      # 插件的依赖可能把 Caddy 抬到更高的版本，推送前先确认版本和三个插件。
      - if: steps.image.outputs.exists == 'false'
        name: check
        run: |
          image="${{ steps.image.outputs.name }}"
          docker run --rm "$image" caddy version | grep -q "^v$CADDY_VERSION " \
            || { docker run --rm "$image" caddy version; echo "Caddy 版本不是 v$CADDY_VERSION"; exit 1; }
          modules=$(docker run --rm "$image" caddy list-modules)
          for m in layer4 http.handlers.rate_limit dns.providers.cloudflare; do
            echo "$modules" | grep -qx "$m" || { echo "缺少模块 $m"; exit 1; }
          done
          docker push "$image"
