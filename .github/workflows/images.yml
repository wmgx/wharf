# 推到 main 时构建 wharf-core / wharf-agent 镜像，推到 ghcr。
# 标签：latest 和 sha-<短提交号>。国内机器可以从 ghcr.nju.edu.cn 拉。
# 同时构建各平台的 wharf CLI，发布到 Release build-<短提交号>；控制面的 /cli.sh 按自己的构建号下载。
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: |
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # 两个 target 共用 build 阶段，第二次直接命中缓存。
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: core
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wharf-core:latest
            ghcr.io/${{ github.repository_owner }}/wharf-core:${{ steps.tag.outputs.sha }}
          build-args: WHARF_BUILD=${{ steps.tag.outputs.build }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: agent
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wharf-agent:latest
            ghcr.io/${{ github.repository_owner }}/wharf-agent:${{ steps.tag.outputs.sha }}
          build-args: WHARF_BUILD=${{ steps.tag.outputs.build }}
          cache-from: type=gha

  # 用刚推上去的镜像跑端到端验证。失败时 workflow 变红；镜像已经推送，红了不要执行 wharf upgrade。
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: e2e
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          tag="sha-${GITHUB_SHA::7}"
          export CORE_IMAGE="ghcr.io/$OWNER/wharf-core:$tag"
          export AGENT_IMAGE="ghcr.io/$OWNER/wharf-agent:$tag"
          docker pull "$CORE_IMAGE"
          docker pull "$AGENT_IMAGE"
          scripts/e2e.sh

  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: wharf-linux-amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: wharf-linux-arm64 }
          - { os: macos-15, target: aarch64-apple-darwin, name: wharf-macos-arm64 }
          - { os: macos-15, target: x86_64-apple-darwin, name: wharf-macos-amd64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      # Linux 静态链接 musl，不依赖机器上的 glibc 版本。
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: |
          export WHARF_BUILD="${GITHUB_SHA::7}"
          cargo build --release --locked -p wharf-cli --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/wharf ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release-cli:
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wharf-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="build-${GITHUB_SHA::7}"
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes "wharf CLI，构建 ${GITHUB_SHA::7}。用控制面的 /cli.sh 安装。" --prerelease
