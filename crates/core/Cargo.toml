[package]
name = "wharf-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "控制面：API、plan/apply、agent 连接"

[[bin]]
name = "wharf-core"
path = "src/main.rs"

[dependencies]
bcrypt.workspace = true
wharf-api-types.workspace = true
wharf-pack.workspace = true
wharf-providers.workspace = true

anyhow.workspace = true
base64.workspace = true
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
axum.workspace = true
chrono.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
# OIDC 的 RS256 签名；rustls 已经带进来，同一版本
aws-lc-rs = "=1.18.2"
futures-util.workspace = true
# 页面登录密码
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash"] }
# 从上传的代码包里读单文件 Worker
flate2 = "=1.1.10"
getrandom.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
hex.workspace = true
if-addrs.workspace = true
ipnet = { version = "2", features = ["serde"] }
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
rpassword = "=7.5.4"
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
urlencoding.workspace = true
hmac.workspace = true
sha1.workspace = true
qrcode.workspace = true
sha2.workspace = true
time = "0.3"
tokio.workspace = true
tar = "=0.4.46"
tokio-util.workspace = true
tower = { version = "0.5", features = ["util"] }
rust-embed.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rustls-pki-types = "1"
rustls-webpki = { version = "0.103", features = ["aws-lc-rs"] }
tempfile = "3"
