<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>服务暂时不可用</title>
  <style>
    :root{color-scheme:light dark}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f7f8;color:#202124;font-family:system-ui,sans-serif}
    main{padding:24px;text-align:center}
    h1{font-size:clamp(22px,5vw,32px);font-weight:600}
    p{font-size:14px;color:#686b70}
    @media(prefers-color-scheme:dark){body{background:#18191b;color:#e8eaed}p{color:#a5a8af}}
  </style>
</head>
<body>
  <main>
    <h1>服务暂时不可用</h1>
    <p>错误 {err.status_code}，请稍后再试</p>
  </main>
</body>
</html>
