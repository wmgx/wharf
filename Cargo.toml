[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
wharf-api-types = { path = "crates/api-types" }
wharf-providers = { path = "crates/providers" }

anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["ws", "json", "macros"] }
base64 = "0.22.1"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
ed25519-dalek = "2.2.0"
futures-util = "0.3.32"
getrandom = "0.3.4"
hex = "0.4.3"
if-addrs = "0.13"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
schemars = { version = "1.2.2", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.47", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7.18"
toml = "0.9.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"

[profile.release]
strip = true
lto = "thin"
